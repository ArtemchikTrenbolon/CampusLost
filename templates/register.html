{% extends 'base.html' %}
{% block title %}Регистрация | CampusLost{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Регистрация</h1>
        <div id="formError" class="alert alert-danger d-none" style="white-space: pre-line;"></div>
        <form id="registerForm">
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="first_name" class="form-label">Имя</label>
              <input type="text" class="form-control" id="first_name" required>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="last_name" class="form-label">Фамилия</label>
              <input type="text" class="form-control" id="last_name" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="group_name" class="form-label">Учебная группа (необязательно)</label>
            <input type="text" class="form-control" id="group_name" placeholder="Например, РИ-310001">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Почта</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Пароль (минимум 8 символов)</label>
            <input type="password" class="form-control" id="password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
        </form>
        <p class="mt-3 mb-0 text-center">Уже есть аккаунт? <a href="/login/">Войти</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('formError');
    errorBox.classList.add('d-none');

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      await API.request('/auth/register/', {
        method: 'POST',
        auth: false,
        body: JSON.stringify({
          first_name: document.getElementById('first_name').value,
          last_name: document.getElementById('last_name').value,
          group_name: document.getElementById('group_name').value,
          email: email,
          password: password,
        }),
      });
      // После регистрации сразу входим
      const data = await API.request('/auth/login/', {
        method: 'POST',
        auth: false,
        body: JSON.stringify({ email, password }),
      });
      API.setAuth(data.token, data.user);
      window.location.href = '/';
    } catch (err) {
      errorBox.textContent = API.formatError(err);
      errorBox.classList.remove('d-none');
    }
  });
</script>
{% endblock %}
