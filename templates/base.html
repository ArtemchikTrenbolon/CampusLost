{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusLost{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">CampusLost</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Лента</a></li>
        <li class="nav-item auth-only d-none"><a class="nav-link" href="/ads/new/">Подать объявление</a></li>
      </ul>
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item guest-only d-none"><a class="nav-link" href="/login/">Войти</a></li>
        <li class="nav-item guest-only d-none"><a class="nav-link" href="/register/">Регистрация</a></li>
        <li class="nav-item auth-only d-none"><span class="navbar-text me-3" id="navUserName"></span></li>
        <li class="nav-item auth-only d-none">
          <button class="btn btn-outline-light btn-sm" id="logoutBtn" type="button">Выйти</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container flex-grow-1 py-4">
  {% block content %}{% endblock %}
</main>

<footer class="bg-light text-center text-muted py-3 border-top">
  <small>CampusLost: сервис «Найдено и потеряно» для кампуса</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
